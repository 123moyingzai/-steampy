# ========== 生产 Profile 覆盖 ==========
# 激活方式：java -jar steampy-backend-1.0.0.jar --spring.profiles.active=prod
# 或外置：spring.config.additional-location=file:/etc/steampy/
#
# 安全：数据库密码必须外置（--spring.config.location / 环境变量），
# 不要把真实密码提交到仓库。

server.port=8080
server.servlet.context-path=/

# 生产要求外置配置覆盖；这里只给占位符，留空或写默认安全值
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/steampy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:steampy}
spring.datasource.password=${DB_PASSWORD:changeme}

# 关闭 SQL stdout 日志，避免生产日志膨胀
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# 上传目录：绝对路径，建议独立数据盘
app.upload-dir=${APP_UPLOAD_DIR:/data/steampy/uploads}

# 订单超时（分钟）
steampy.order.timeout-minutes=15

# SPA fallback 保持开启（单 jar 部署时需要）
steampy.spa-fallback=true

# Jackson 在生产也保留 snake_case，与前端约定一致
spring.jackson.property-naming-strategy=SNAKE_CASE

# 服务端压缩（Gzip）—— 小代价减少带宽占用
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json
server.compression.min-response-size=1024
